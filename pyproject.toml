[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-platform"
version = "1.0.0"
description = "Multilingual (en/fr/ar) OCR and document extraction service, CPU-first"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "pymupdf==1.28.2",
    "python-docx>=1.1",
    "pillow>=10.4",
    "numpy>=1.26",
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
    "lingua-language-detector>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs real OCR with downloaded models (deselect with -m 'not integration')",
]
filterwarnings = ["ignore::DeprecationWarning"]
